name: CI

on: [push, pull_request]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest -q || true

  build-and-push:
    name: Build and push Docker image (optional)
    runs-on: ubuntu-latest
    needs: test
    if: secrets.GHCR_PAT != ''
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/reus-veritas-os:latest
            ghcr.io/${{ github.repository_owner }}/reus-veritas-os:${{ github.sha }}

  build-local:
    name: Build local image (no push)
    runs-on: ubuntu-latest
    needs: test
    if: secrets.GHCR_PAT == ''
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -t reus-veritas-os:ci .
